on:
  push:
    branches: [main, master]
    paths:
      - 'README.Rmd'
      - 'DESCRIPTION'

name: render-readme.yaml

permissions:
  contents: write

jobs:
  render-readme:
    runs-on: ubuntu-latest
    # Same setup-r apt exposure as the others. See #126.
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::badger

      - name: Render README.md
        run: rmarkdown::render("README.Rmd", quiet = TRUE)
        shell: Rscript {0}

      - name: Commit and push updated README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-render README.md [skip ci]"
          git push
