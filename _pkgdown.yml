url: https://quallmer.github.io/quallmer/
template:
  bootstrap: 5
  pandoc:
    args: ["--syntax-highlighting=tango"]
get_started:
  template: getting-started.html
navbar:
  structure:
    left:
    - home
    - quick-start
    - tutorials
    - examples
    - workshops
    - reference
    - news
    right:
    - search
    - github
  components:
    quick-start:
      text: Getting started
      menu:
      - text: Quick start guide
        href: articles/getting-started.html
      - text: The quallmer workflow
        href: articles/pkgdown/getting-started/workflow.html
      - text: Signing up for an OpenAI API key
        href: articles/pkgdown/getting-started/openai.html
      - text: Working with an open-source Ollama model
        href: articles/pkgdown/getting-started/ollama.html
    tutorials:
      text: Tutorials
      menu:
      - text: The quallmer audit trail
        href: articles/pkgdown/tutorials/trail.html
      - text: Coding with web-search tools
        href: articles/pkgdown/tutorials/tools.html
      - text: Using the quallmer.app
        href: articles/pkgdown/tutorials/validate.html
    examples:
      text: Examples
      menu:
      - text: Illiberalism in political speeches
        href: articles/pkgdown/examples/example_illiberalism.html
      - text: Image analysis of campaign posters
        href: articles/pkgdown/examples/example_images.html
      - text: Audio transcription and analysis
        href: articles/pkgdown/examples/example_audio.html
      - text: Text segmentation
        href: articles/pkgdown/examples/example_segmentation.html
      - text: Quasi-sentence segmentation
        href: articles/pkgdown/examples/example_quasi_sentences.html
    reference:
      text: Reference
      href: reference/index.html
    workshops:
      text: Workshops
      href: articles/pkgdown/workshops.html
    github:
      icon: fab fa-github
      href: https://github.com/quallmer/quallmer
      aria-label: View on GitHub

# Exclude maintainer/contributor Markdown files from home pages
home:
  exclude:
    - AGENTS.md
    - CLAUDE.md

# Reference index organization
reference:
  - title: Core coding functions
    desc: Functions for LLM-powered coding of qualitative data
    contents:
      - qlm_code
      - qlm_replicate
      - qlm_backfill
      - qlm_codebook
      - qlm_segment

  - title: Advanced configuration
    desc: Optional session configuration for additional models and provider endpoints
    contents:
      - qlm_register_model
      - qlm_register_provider

  - title: Human-coded data
    desc: Convert and work with human-coded or externally coded data
    contents:
      - as_qlm_coded
      - qlm_humancoded

  - title: Accessor functions
    desc: Extract and modify metadata and components from quallmer objects
    contents:
      - accessors
      - qlm_meta
      - "`qlm_meta<-`"
      - codebook
      - inputs
      - qlm_failures

  - title: Validation and comparison
    desc: Assess reliability and validate against gold standards
    contents:
      - qlm_validate
      - qlm_compare
      - qlm_trail

  - title: Predefined codebooks
    desc: Ready-to-use codebooks for common coding tasks
    contents:
      - data_codebook_sentiment
      - data_codebook_immigration

  - title: Example data
    desc: Sample datasets for testing and examples
    contents:
      - starts_with("data_corpus_")
